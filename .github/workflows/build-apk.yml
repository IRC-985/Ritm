name: Сборка APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Установка зависимостей
        run: npm install
      - name: Android-проект
        run: |
          npx cap add android
          npx cap sync android
          # только портретная ориентация
          sed -i 's/<activity /<activity android:screenOrientation="portrait" /' android/app/src/main/AndroidManifest.xml
          # иконка приложения
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp www/icon-192.png android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp www/icon-192.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
      - name: Сборка
        run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ritm-trener-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Выложить APK в релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ritm-trener.apk
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" ritm-trener.apk --title "Ритм-тренажёр $TAG" --notes "Скачайте ritm-trener.apk и установите на телефон." --latest
