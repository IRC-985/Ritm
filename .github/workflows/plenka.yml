name: Плёнка — сборка
on:
  push:
    paths: ['plenka/**', '.github/workflows/plenka.yml']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: plenka

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Зависимости
        run: npm install --no-audit --no-fund
        env: { ELECTRON_SKIP_BINARY_DOWNLOAD: '1' }
      - name: Сборка веб-части
        run: npm run build
      - name: Android-проект
        run: |
          npx cap add android
          npx cap sync android
          M=android/app/src/main/AndroidManifest.xml
          # больше памяти и аппаратное ускорение для обработки больших RAW
          sed -i 's/<application /<application android:largeHeap="true" android:hardwareAccelerated="true" /' $M
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n</manifest>#' $M
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp public/icon-192.png android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp public/icon-192.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
      - name: Сборка APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk plenka.apk
      - uses: actions/upload-artifact@v4
        with: { name: plenka-android, path: plenka/plenka.apk }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Зависимости
        run: npm install --no-audit --no-fund
      - name: Сборка .exe
        run: npm run dist:win
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with:
          name: plenka-windows
          path: |
            plenka/release/Plenka-setup.exe
            plenka/release/Plenka-portable.exe

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Выложить в релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          TAG="plenka-v0.1.${{ github.run_number }}"
          FLAGS="--prerelease"
          if [ "${{ github.ref_name }}" = "main" ]; then FLAGS=""; fi
          gh release create "$TAG" out/plenka.apk out/Plenka-setup.exe out/Plenka-portable.exe \
            --target "${{ github.sha }}" $FLAGS \
            --title "Плёнка $TAG" \
            --notes "Android: скачайте plenka.apk и установите. Windows: Plenka-setup.exe (установщик) или Plenka-portable.exe (без установки). Ветка: ${{ github.ref_name }}."
